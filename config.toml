baseURL = 'https://sunnyqingtian.github.io/my--hugo-blog/'
title = '我的博客'
theme = 'book'
languageCode = 'zh-cn'

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 3
  [markup.highlight]
    style = 'github'
    guessSyntax = true

[params]
  BookTheme = 'auto'
  BookToC = true
  BookSection = 'docs'
  BookSearch = true
  BookDateFormat = '2006年1月2日'
  BookCodeCopy = true

[menu]
  [[menu.main]]
    name = '首页'
    url = '/'
    weight = 1
  [[menu.main]]
    name = '文档'
    url = '/docs/'
    weight = 2
